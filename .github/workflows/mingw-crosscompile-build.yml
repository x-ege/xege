name: MinGW Cross-Compile Build

on:
  push:
    branches: [ master, feature/opengl-backend ]
  pull_request:
    # 所有分支的 PR 都触发
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: false
        default: 'Release'
        type: choice
        options:
        - Release
        - Debug

permissions:
  contents: read

jobs:
  # Ubuntu 交叉编译
  ubuntu-cross-compile:
    name: Ubuntu Cross-Compile - ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        build_type: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.build_type) || '["Release","Debug"]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install MinGW-w64 cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            mingw-w64 \
            mingw-w64-tools \
            gcc-mingw-w64-x86-64 \
            g++-mingw-w64-x86-64 \
            cmake \
            make \
            git

      - name: Print MinGW version info
        run: |
          echo "=== MinGW-w64 Cross-Compiler (Ubuntu) Environment Information ==="
          echo "x86_64-w64-mingw32-gcc version:"
          x86_64-w64-mingw32-gcc --version
          echo ""
          echo "x86_64-w64-mingw32-g++ version:"
          x86_64-w64-mingw32-g++ --version
          echo ""
          echo "CMake version:"
          cmake --version
          echo ""
          echo "Make version:"
          make --version
          echo ""
          echo "Host system:"
          uname -a

      - name: Cross-compile with MinGW-w64
        env:
          BUILD_TYPE: ${{ matrix.build_type }}
        run: |
          # Clean previous builds
          rm -rf build-mingw-ubuntu

          # Configure CMake for cross-compilation
          mkdir -p build-mingw-ubuntu
          cd build-mingw-ubuntu

          cmake .. \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DEGE_BUILD_OPENGL=OFF \
            -DEGE_ENABLE_CAMERA_CAPTURE=ON \
            -DEGE_BUILD_DEMO=ON \
            -DEGE_BUILD_TEST=OFF \
            -DEGE_BUILD_TEMP=OFF

          grep -Eq '^EGE_BUILD_FOR_LINUX:BOOL=OFF$' CMakeCache.txt
          grep -R -Eq '^set\(CMAKE_SYSTEM_NAME "Windows"\)$' \
            CMakeFiles/*/CMakeSystem.cmake

          # Build the project
          cmake --build . --parallel $(nproc)
          cmake --build . --target demos --parallel $(nproc)

          test -f libgraphics.a
          x86_64-w64-mingw32-objdump -f libgraphics.a | \
            grep -Eq 'file format (pe|pei)-x86-64'
          find demo -type f -name '*.exe' -print -quit | grep -q .

      - name: Package MinGW Ubuntu artifacts
        env:
          BUILD_TYPE: ${{ matrix.build_type }}
        run: |
          # Create build-type specific directory structure
          mkdir -p ${BUILD_TYPE}/lib/mingw-w64-ubuntu

          # Package only EGE, never host/test dependency archives.
          cp build-mingw-ubuntu/libgraphics.a \
            ${BUILD_TYPE}/lib/mingw-w64-ubuntu/libgraphics.a

          # Verify that libraries were actually found and copied
          LIBRARY_COUNT=$(find ${BUILD_TYPE}/lib/mingw-w64-ubuntu -type f -name "*.a" | wc -l)
          if [ "$LIBRARY_COUNT" -eq 0 ]; then
            echo "ERROR: No .a libraries found in build output!"
            exit 1
          fi
          echo "Successfully packaged $LIBRARY_COUNT library files"

          # List generated files
          echo "Generated MinGW Ubuntu libraries for $BUILD_TYPE:"
          ls -la ${BUILD_TYPE}/lib/mingw-w64-ubuntu/

      - name: Upload MinGW Ubuntu artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xege-mingw-ubuntu-${{ matrix.build_type }}-libraries
          path: ${{ matrix.build_type }}/lib/mingw-w64-ubuntu/
          retention-days: 30
        if: success()

  # macOS 交叉编译
  macos-cross-compile:
    name: macOS Cross-Compile - ${{ matrix.build_type }}
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      matrix:
        build_type: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.build_type) || '["Release","Debug"]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install MinGW-w64 cross-compiler
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          for attempt in 1 2 3; do
            if brew install mingw-w64; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "ERROR: Failed to install MinGW-w64 after 3 attempts"
              exit 1
            fi
            sleep 10
          done

          # Verify MinGW-w64 installation
          x86_64-w64-mingw32-gcc --version || (echo "ERROR: MinGW-w64 installation verification failed" && exit 1)

      - name: Print MinGW version info
        run: |
          echo "=== MinGW-w64 Cross-Compiler (macOS) Environment Information ==="
          echo "x86_64-w64-mingw32-gcc version:"
          x86_64-w64-mingw32-gcc --version
          echo ""
          echo "x86_64-w64-mingw32-g++ version:"
          x86_64-w64-mingw32-g++ --version
          echo ""
          echo "CMake version:"
          cmake --version
          echo ""
          echo "Make version:"
          make --version
          echo ""
          echo "Host system:"
          uname -a

      - name: Cross-compile with MinGW-w64
        env:
          BUILD_TYPE: ${{ matrix.build_type }}
        run: |
          # Clean previous builds
          rm -rf build-mingw-macos

          # Configure CMake for cross-compilation
          mkdir -p build-mingw-macos
          cd build-mingw-macos

          cmake .. \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DEGE_BUILD_OPENGL=OFF \
            -DEGE_ENABLE_CAMERA_CAPTURE=ON \
            -DEGE_BUILD_DEMO=ON \
            -DEGE_BUILD_TEST=OFF \
            -DEGE_BUILD_TEMP=OFF

          grep -Eq '^EGE_BUILD_FOR_LINUX:BOOL=OFF$' CMakeCache.txt
          grep -R -Eq '^set\(CMAKE_SYSTEM_NAME "Windows"\)$' \
            CMakeFiles/*/CMakeSystem.cmake

          # Build the project
          cmake --build . --parallel $(sysctl -n hw.ncpu)
          cmake --build . --target demos --parallel $(sysctl -n hw.ncpu)

          test -f libgraphics.a
          x86_64-w64-mingw32-objdump -f libgraphics.a | \
            grep -Eq 'file format (pe|pei)-x86-64'
          find demo -type f -name '*.exe' -print -quit | grep -q .

      - name: Package macOS cross-compiled artifacts
        env:
          BUILD_TYPE: ${{ matrix.build_type }}
        run: |
          # Create build-type specific directory structure
          mkdir -p ${BUILD_TYPE}/lib/mingw-w64-macos

          # Package only EGE, never host/test dependency archives.
          cp build-mingw-macos/libgraphics.a \
            ${BUILD_TYPE}/lib/mingw-w64-macos/libgraphics.a

          # Verify that libraries were actually found and copied
          LIBRARY_COUNT=$(find ${BUILD_TYPE}/lib/mingw-w64-macos -type f -name "*.a" | wc -l)
          if [ "$LIBRARY_COUNT" -eq 0 ]; then
            echo "ERROR: No .a libraries found in build output!"
            exit 1
          fi
          echo "Successfully packaged $LIBRARY_COUNT library files"

          # List generated files
          echo "Generated MinGW macOS cross-compiled libraries for $BUILD_TYPE:"
          ls -la ${BUILD_TYPE}/lib/mingw-w64-macos/

      - name: Upload macOS cross-compiled artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xege-mingw-macos-${{ matrix.build_type }}-libraries
          path: ${{ matrix.build_type }}/lib/mingw-w64-macos/
          retention-days: 30
        if: success()
