name: MinGW Linux Cross-Compile Build

on:
  push:
    branches: [ master ]
  pull_request:
    # 所有分支的 PR 都触发
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: false
        default: 'Release'
        type: choice
        options:
        - Release
        - Debug

jobs:
  # Ubuntu 交叉编译
  ubuntu-cross-compile:
    name: Ubuntu Cross-Compile - ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: ["Release", "Debug"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install MinGW-w64 cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            mingw-w64 \
            mingw-w64-tools \
            gcc-mingw-w64-x86-64 \
            g++-mingw-w64-x86-64 \
            cmake \
            make \
            git

      - name: Print MinGW version info
        run: |
          echo "=== MinGW-w64 Cross-Compiler (Ubuntu) Environment Information ==="
          echo "x86_64-w64-mingw32-gcc version:"
          x86_64-w64-mingw32-gcc --version
          echo ""
          echo "x86_64-w64-mingw32-g++ version:"
          x86_64-w64-mingw32-g++ --version
          echo ""
          echo "CMake version:"
          cmake --version
          echo ""
          echo "Make version:"
          make --version
          echo ""
          echo "Host system:"
          uname -a

      - name: Cross-compile with MinGW-w64
        env:
          BUILD_TYPE: ${{ matrix.build_type }}
          DO_TEST_RELEASE_LIBS: true
        run: |
          # Configure CMake with an explicit Windows target. Host detection is
          # not sufficient: without this toolchain AUTO selects the Linux backend.
          cmake -S . -B build-mingw-ubuntu \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/mingw-w64.cmake \
            -DEGE_ENABLE_CAMERA_CAPTURE=ON \
            -DEGE_BUILD_DEMO=ON

          # Build the project
          cmake --build build-mingw-ubuntu --parallel $(nproc)
          # Demo targets are excluded from ALL, so EGE_BUILD_DEMO=ON alone
          # only configures them. Link every demo to catch missing platform
          # sources and transitive Windows libraries.
          cmake --build build-mingw-ubuntu --target demos --parallel $(nproc)

      - name: Package MinGW Ubuntu artifacts
        env:
          BUILD_TYPE: ${{ matrix.build_type }}
        run: |
          # Create build-type specific directory structure
          mkdir -p ${BUILD_TYPE}/lib/mingw-w64-ubuntu

          # Publish only the SDK archive; libtest_framework.a is internal.
          test -f build-mingw-ubuntu/libgraphics.a
          cp build-mingw-ubuntu/libgraphics.a \
            ${BUILD_TYPE}/lib/mingw-w64-ubuntu/
          test "$(find ${BUILD_TYPE}/lib/mingw-w64-ubuntu -maxdepth 1 \
            -type f -name '*.a' | wc -l)" -eq 1

          # List generated files
          echo "Generated MinGW Ubuntu libraries for $BUILD_TYPE:"
          ls -la ${BUILD_TYPE}/lib/mingw-w64-ubuntu/

      - name: Upload MinGW Ubuntu artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xege-mingw-ubuntu-${{ matrix.build_type }}-libraries
          path: ${{ matrix.build_type }}/lib/mingw-w64-ubuntu/
          retention-days: 30
        if: success()
