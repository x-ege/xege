name: MSVC Build

on:
  push:
    branches: [ master ]
  pull_request:
    # 所有分支的 PR 都触发
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vs2026-build:
    name: MSVC 2026 Build (${{ matrix.build_type }})
    runs-on: windows-latest
    strategy:
      matrix:
        build_type: ["Release", "Debug"]
    steps:
      - name: Check VS2026 (v145 toolset) availability
        id: check_vs2026
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          # v145 is a PlatformToolset name; the VS2026 MSBuild targets live
          # below VC\v180, not VC\v145. Probe the exact CMake generator/toolset
          # pair instead of relying on Visual Studio's internal directory layout.
          $vs2026 = @(& $vswhere -products "*" -version "[18.0,19.0)" `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath 2>$null) | Select-Object -First 1
          $probeSucceeded = $false
          if ($vs2026) {
            $probeRoot = Join-Path $env:RUNNER_TEMP `
              ("xege-vs2026-v145-" + [guid]::NewGuid().ToString("N"))
            New-Item -ItemType Directory -Force -Path $probeRoot | Out-Null
            @(
              "cmake_minimum_required(VERSION 3.13)"
              "project(xege_vs2026_v145_probe LANGUAGES CXX)"
            ) | Set-Content -Path (Join-Path $probeRoot "CMakeLists.txt") -Encoding ascii

            cmake -S $probeRoot -B (Join-Path $probeRoot "build") `
              -G "Visual Studio 18 2026" -A x64 -T v145 `
              -DCMAKE_GENERATOR_INSTANCE="$vs2026"
            $probeSucceeded = $LASTEXITCODE -eq 0
            Remove-Item -Recurse -Force $probeRoot
          }

          if ($probeSucceeded) {
            "VS2026_AVAILABLE=true" | Out-File -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 -Append
            "VS2026_INSTANCE=$vs2026" | Out-File -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 -Append
            echo "✅ Visual Studio 2026 with v145 is usable at: $vs2026"
          } else {
            "VS2026_AVAILABLE=false" | Out-File -FilePath $env:GITHUB_OUTPUT `
              -Encoding utf8 -Append
            echo "⏭️ Visual Studio 18 2026 with v145 is not usable on this runner."
            echo "⏭️ Skipping VS2026 build."
            echo ""
            echo "=== Available Visual Studio Installations (via vswhere) ==="
            & $vswhere -all -format text
          }
        shell: powershell

      - name: Checkout repository
        if: steps.check_vs2026.outputs.VS2026_AVAILABLE == 'true'
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup Visual Studio environment
        if: steps.check_vs2026.outputs.VS2026_AVAILABLE == 'true'
        uses: microsoft/setup-msbuild@v1.1

      - name: Configure CMake
        if: steps.check_vs2026.outputs.VS2026_AVAILABLE == 'true'
        run: |
          cmake -S . -B build-vs2026 -G "Visual Studio 18 2026" -A x64 -T v145 `
            "-DCMAKE_GENERATOR_INSTANCE=${{ steps.check_vs2026.outputs.VS2026_INSTANCE }}" `
            -DEGE_BUILD_DEMO=ON -DEGE_ENABLE_CAMERA_CAPTURE=ON

      - name: Build
        if: steps.check_vs2026.outputs.VS2026_AVAILABLE == 'true'
        env:
          DO_TEST_RELEASE_LIBS: true
        run: |
          cd build-vs2026
          cmake --build . --config ${{ matrix.build_type }} --parallel

      - name: Run deterministic CMake contract tests
        if: steps.check_vs2026.outputs.VS2026_AVAILABLE == 'true'
        run: >-
          ctest --test-dir build-vs2026 -C ${{ matrix.build_type }}
          --output-on-failure --timeout 60 -LE performance

  vs2022-build:
    name: MSVC 2022 Build (${{ matrix.build_type }})
    runs-on: windows-latest
    strategy:
      matrix:
        build_type: ["Release", "Debug"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup Visual Studio environment
        uses: microsoft/setup-msbuild@v1.1

      - name: Configure CMake
        run: |
          mkdir build-vs2022
          cd build-vs2022
          cmake .. -T v143 -DEGE_BUILD_DEMO=ON -DEGE_ENABLE_CAMERA_CAPTURE=ON # vs2022
      - name: Build
        env:
          DO_TEST_RELEASE_LIBS: true
        run: |
          cd build-vs2022
          cmake --build . --config ${{ matrix.build_type }} --parallel
      - name: Run deterministic CMake contract tests
        run: >-
          ctest --test-dir build-vs2022 -C ${{ matrix.build_type }}
          --output-on-failure --timeout 60 -LE performance

  vs2019-build:
    name: MSVC 2019 Build (${{ matrix.build_type }})
    runs-on: windows-latest
    strategy:
      matrix:
        build_type: ["Release", "Debug"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
        
      - name: Setup Visual Studio environment
        uses: microsoft/setup-msbuild@v1.1

      - name: Configure CMake
        run: |
          mkdir build-vs2019
          cd build-vs2019
          cmake .. -T v142 -DEGE_BUILD_DEMO=ON -DEGE_ENABLE_CAMERA_CAPTURE=ON
      - name: Build
        env:
          DO_TEST_RELEASE_LIBS: true
        run: |
          cd build-vs2019
          cmake --build . --config ${{ matrix.build_type }} --parallel
      - name: Run deterministic CMake contract tests
        run: >-
          ctest --test-dir build-vs2019 -C ${{ matrix.build_type }}
          --output-on-failure --timeout 60 -LE performance

  # 注意：VS2015 (v140) / VS2017 (v141) / VS2010-VS2013 (v100-v120) 已从 CI 中移除
  # 原因：
  #   1. GitHub 已于 2025-06-30 退役 windows-2019 runner 镜像，而 v140/v141 工具集
  #      原本依赖该镜像预装；改用 windows-latest 后需手动安装，脆弱且缓慢。
  #   2. Chocolatey 已移除 v100-v120 的 build tools 包，微软官方也不再提供独立安装程序。
  # 这些编译器版本已超过 8 年，库本身仍兼容，只是 CI 不再覆盖。
