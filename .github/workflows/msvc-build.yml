name: MSVC GDI Build and Test

on:
  push:
    branches: [master, feature/opengl-backend]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: msvc-gdi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msvc-gdi:
    name: ${{ matrix.name }} ${{ matrix.build-type }}
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: VS2022
            toolset: v143
            build-type: Debug
          - name: VS2022
            toolset: v143
            build-type: Release
          - name: VS2019-toolset
            toolset: v142
            build-type: Debug
          - name: VS2019-toolset
            toolset: v142
            build-type: Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Configure default Windows GDI build
        shell: powershell
        run: >
          cmake -S . -B build/msvc
          -A x64
          -T ${{ matrix.toolset }}
          -DEGE_BUILD_OPENGL=OFF
          -DEGE_ENABLE_CAMERA_CAPTURE=ON
          -DEGE_BUILD_DEMO=ON
          -DEGE_BUILD_TEST=ON
          -DEGE_BUILD_TEMP=OFF

      - name: Build library, demos, and tests
        run: |
          cmake --build build/msvc `
            --config ${{ matrix.build-type }} `
            --parallel
          cmake --build build/msvc `
            --config ${{ matrix.build-type }} `
            --target demos `
            --parallel

      - name: Run Windows GDI functional tests
        run: >
          ctest --test-dir build/msvc
          -C ${{ matrix.build-type }}
          --output-on-failure
          --no-tests=error
          --timeout 300
          -LE performance

      - name: Stage the raw VS2022 release library
        if: matrix.name == 'VS2022' && matrix.build-type == 'Release'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path Release/lib/vs2022/x64
          Copy-Item build/msvc/Release/graphics.lib Release/lib/vs2022/x64/graphics.lib

      - name: Configure a standalone prebuilt-library consumer
        if: matrix.name == 'VS2022' && matrix.build-type == 'Release'
        shell: powershell
        run: >
          cmake -S demo -B build/prebuilt-consumer
          -A x64
          -T v143
          -DEGE_BUILD_DEMO_WITH_PREBUILT_LIBS=ON

      - name: Link camera and drawing demos against raw graphics.lib
        if: matrix.name == 'VS2022' && matrix.build-type == 'Release'
        run: >
          cmake --build build/prebuilt-consumer
          --config Release
          --target camera_base graph_5star
          --parallel

# VS2017/v141 prebuilt-package compatibility is exercised by release.yml,
# which installs the optional v141 component on windows-2022 explicitly.
