name: MSVC Build

on:
  push:
    branches: [ master ]
  pull_request:
    # 所有分支的 PR 都触发
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vs2026-build:
    name: MSVC 2026 Build (${{ matrix.build_type }})
    runs-on: windows-latest
    strategy:
      matrix:
        build_type: ["Release", "Debug"]
    steps:
      - name: Check VS2026 (v145 toolset) availability
        id: check_vs2026
        run: |
          # Check if VS2026 and its v145 toolset are available using vswhere
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          
          # Check for VS2026 installation
          $vs2026 = & $vswhere -version "[18.0,19.0)" -property installationPath 2>$null
          
          $v145Found = $false
          if ($vs2026) {
            $v145Path = Join-Path $vs2026 "MSBuild\Microsoft\VC\v145"
            if (Test-Path $v145Path) {
              $v145Found = $true
              echo "✅ v145 toolset found at: $v145Path"
            }
          }
          
          if ($vs2026 -and $v145Found) {
            echo "VS2026_AVAILABLE=true" >> $env:GITHUB_OUTPUT
            echo "✅ Visual Studio 2026 is installed at: $vs2026"
          } else {
            echo "VS2026_AVAILABLE=false" >> $env:GITHUB_OUTPUT
            echo "⏭️ VS2026 with v145 toolset is not available on this runner."
            echo "⏭️ Skipping VS2026 build."
            echo ""
            echo "=== Available Visual Studio Installations (via vswhere) ==="
            & $vswhere -all -format text
          }
        shell: powershell

      - name: Checkout repository
        if: steps.check_vs2026.outputs.VS2026_AVAILABLE == 'true'
        uses: actions/checkout@v4
      
      - name: Setup Visual Studio environment
        if: steps.check_vs2026.outputs.VS2026_AVAILABLE == 'true'
        uses: microsoft/setup-msbuild@v1.1

      - name: Configure CMake
        if: steps.check_vs2026.outputs.VS2026_AVAILABLE == 'true'
        run: |
          mkdir build-vs2026
          cd build-vs2026
          cmake .. -T v145 -DEGE_BUILD_DEMO=ON

      - name: Build
        if: steps.check_vs2026.outputs.VS2026_AVAILABLE == 'true'
        env:
          DO_TEST_RELEASE_LIBS: true
        run: |
          cd build-vs2026
          cmake --build . --config ${{ matrix.build_type }} --parallel

  vs2022-build:
    name: MSVC 2022 Build (${{ matrix.build_type }})
    runs-on: windows-latest
    strategy:
      matrix:
        build_type: ["Release", "Debug"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Visual Studio environment
        uses: microsoft/setup-msbuild@v1.1

      - name: Configure CMake
        run: |
          mkdir build-vs2022
          cd build-vs2022
          cmake .. -T v143 -DEGE_BUILD_DEMO=ON # vs2022
      - name: Build
        env:
          DO_TEST_RELEASE_LIBS: true
        run: |
          cd build-vs2022
          cmake --build . --config ${{ matrix.build_type }} --parallel

  vs2019-build:
    name: MSVC 2019 Build (${{ matrix.build_type }})
    runs-on: windows-latest
    strategy:
      matrix:
        build_type: ["Release", "Debug"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Visual Studio environment
        uses: microsoft/setup-msbuild@v1.1

      - name: Configure CMake
        run: |
          mkdir build-vs2019
          cd build-vs2019
          cmake .. -T v142 -DEGE_BUILD_DEMO=ON
      - name: Build
        env:
          DO_TEST_RELEASE_LIBS: true
        run: |
          cd build-vs2019
          cmake --build . --config ${{ matrix.build_type }} --parallel

  # 注意：VS2015 (v140) / VS2017 (v141) / VS2010-VS2013 (v100-v120) 已从 CI 中移除
  # 原因：
  #   1. GitHub 已于 2025-06-30 退役 windows-2019 runner 镜像，而 v140/v141 工具集
  #      原本依赖该镜像预装；改用 windows-latest 后需手动安装，脆弱且缓慢。
  #   2. Chocolatey 已移除 v100-v120 的 build tools 包，微软官方也不再提供独立安装程序。
  # 这些编译器版本已超过 8 年，库本身仍兼容，只是 CI 不再覆盖。